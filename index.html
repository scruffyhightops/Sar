<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAR — Spectral Activity Response</title>
<style>
body{margin:0;background:#111;color:#eee;font:14px Courier New,monospace}header{padding:14px;border-bottom:1px solid #777;display:flex;justify-content:space-between}main{max-width:900px;margin:auto;padding:16px}.screen{display:none}.active{display:block}.panel{border:1px solid #777;padding:14px;margin:12px 0;background:#171717}button,input{font:inherit;color:#eee;background:#101010;border:1px solid #777;border-radius:0;padding:10px}button{cursor:pointer;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{margin-bottom:12px}label{display:block;font-size:11px;color:#aaa;margin-bottom:4px}.wide{grid-column:1/-1}.timeline{border-left:1px solid #777;padding-left:14px}.event{margin:0 0 12px}.archive{border:1px solid #777;padding:12px;margin:8px 0}.small{font-size:11px;color:#aaa}.notice{border-left:3px solid #d7bd45;padding:8px;background:#191919;font-size:11px}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){.grid,.grid3{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head>
<body>
<header><div><b>SAR // SPECTRAL ACTIVITY RESPONSE</b><div class="small">FIELD RESPONSE TERMINAL / v0.3</div></div><span id="status">STANDBY</span></header>
<main>
<section id="home" class="screen active"><h1>FIELD RESPONSE</h1><div class="panel"><div><label>ACTIVE CASE</label><strong id="homeCase">NO ACTIVE CASE</strong></div><div style="margin-top:12px" class="row"><button onclick="show('intake')">NEW CASE</button><button onclick="show('active')">ACTIVE CASE</button><button onclick="show('archive')">CASE ARCHIVE</button></div></div><div class="notice">ARCHIVE STORAGE IS LOCAL TO THIS DEVICE AND IS SEPARATE FROM THE ACTIVE CASE.</div></section>
<section id="intake" class="screen"><h1>CASE INTAKE</h1><div class="panel"><div class="grid">
<div class="field"><label>CASE ID</label><input id="id" placeholder="ECTO-2026-0042"></div><div class="field"><label>FIELD UNIT</label><input id="unit"></div>
<div class="field"><label>LOCATION</label><input id="loc"></div><div class="field"><label>VEHICLE</label><input id="vehicle" value="ECTO RESPONSE"></div>
</div><div class="row"><button onclick="newCase()">CREATE CASE</button><button onclick="show('home')">CANCEL</button></div></div></section>
<section id="active" class="screen"><h1>ACTIVE RESPONSE</h1><div id="activeView"></div></section>
<section id="archive" class="screen"><h1>CASE ARCHIVE</h1><div class="panel"><label>SEARCH CASE ID / LOCATION / DATE</label><input id="search" style="width:100%" oninput="renderArchive()"><div id="count" class="small" style="margin-top:7px"></div></div><div id="archiveList"></div><div class="row"><button onclick="show('home')">RETURN HOME</button><button onclick="show('active')">ACTIVE CASE</button></div></section>
<section id="archiveView" class="screen"><h1>ARCHIVED RESPONSE</h1><div id="archiveDetail"></div></section>
</main>
<script>
const AK='sar_v03_active_case', AP='sar_v03_archive_'; let active=null, archived=null;
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); 
const stamp=()=>new Date().toLocaleString('en-GB',{dateStyle:'short',timeStyle:'medium'});
function key(id){return AP+btoa(unescape(encodeURIComponent(id))).replace(/=/g,'')}
function load(){try{active=JSON.parse(localStorage.getItem(AK)||'null')}catch(e){active=null} update()}
function save(){localStorage.setItem(AK,JSON.stringify(active))}
function update(){$('status').textContent=active?.status||'STANDBY';$('homeCase').textContent=active?.caseId||'NO ACTIVE CASE'}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');if(id==='active')renderActive();if(id==='archive')renderArchive();update()}
function newCase(){active={caseId:$('id').value.trim()||'ECTO-'+Date.now(),unit:$('unit').value.trim(),location:$('loc').value.trim(),vehicle:$('vehicle').value.trim(),status:'DISPATCHED',createdAt:stamp(),events:[],evidence:[]};active.events.push({type:'CASE CREATED',time:stamp(),text:'Case intake completed.'});save();show('active')}
function event(type){if(!active)return;let t=prompt(type+' — ENTER RECORD');if(t===null)return;active.events.push({type,time:stamp(),text:t});if(type==='ARRIVAL')active.status='ON SITE';if(['OBSERVATION','EVENT'].includes(type))active.status='ACTIVE RESPONSE';save();renderActive();update()}
function evidence(){if(!active)return;let t=prompt('EVIDENCE NOTE');if(t===null)return;let n='E'+String(active.evidence.length+1).padStart(3,'0');active.evidence.push({id:n,time:stamp(),note:t});active.events.push({type:'EVIDENCE',time:stamp(),text:n+' recorded.'});save();renderActive()}
function status(s){if(!active)return;active.status=s;active.events.push({type:'STATUS',time:stamp(),text:'Response status set to '+s+'.'});save();renderActive();update()}
function archives(){let a=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k?.startsWith(AP))try{a.push(JSON.parse(localStorage.getItem(k)))}catch(e){}}return a.sort((a,b)=>String(b.archivedAt).localeCompare(String(a.archivedAt)))}
function complete(){if(!active)return;active.status='COMPLETE';active.events.push({type:'RESPONSE COMPLETE',time:stamp(),text:'Field response completed.'});active.archivedAt=stamp();active.archived=true;localStorage.setItem(key(active.caseId),JSON.stringify(active));localStorage.removeItem(AK);active=null;update();show('archive')}
function tl(e){return e?.length?'<div class="timeline">'+e.map(x=>'<div class="event"><b>'+esc(x.type)+' // '+esc(x.time)+'</b><div>'+esc(x.text)+'</div></div>').join('')+'</div>':'<span class="small">NO RECORDS</span>'}
function renderActive(){if(!active){$('activeView').innerHTML='<div class="panel">NO ACTIVE CASE</div><button onclick="show(\'intake\')">NEW CASE</button>';return}
$('activeView').innerHTML='<div class="panel"><div class="grid"><div><label>CASE ID</label>'+esc(active.caseId)+'</div><div><label>STATUS</label>'+esc(active.status)+'</div><div><label>LOCATION</label>'+esc(active.location)+'</div><div><label>UNIT / VEHICLE</label>'+esc(active.unit)+' / '+esc(active.vehicle)+'</div></div></div>'+
'<div class="panel"><label>FIELD RECORD</label><div class="grid3"><button onclick="event(\'ARRIVAL\')">ARRIVAL</button><button onclick="event(\'OBSERVATION\')">OBSERVATION</button><button onclick="event(\'STATEMENT\')">STATEMENT</button><button onclick="event(\'ENVIRONMENT\')">ENVIRONMENT</button><button onclick="event(\'EVENT\')">EVENT</button><button onclick="event(\'ACTION\')">ACTION</button><button onclick="event(\'EQUIPMENT\')">EQUIPMENT</button><button onclick="evidence()">EVIDENCE</button><button onclick="event(\'NOTE\')">NOTE</button></div></div>'+
'<div class="panel"><label>RESPONSE STATUS</label><div class="row"><button onclick="status(\'STANDBY\')">STANDBY</button><button onclick="status(\'DISPATCHED\')">DISPATCHED</button><button onclick="status(\'ON SITE\')">ON SITE</button><button onclick="status(\'ACTIVE RESPONSE\')">ACTIVE RESPONSE</button><button onclick="status(\'STANDING DOWN\')">STANDING DOWN</button></div></div>'+
'<div class="panel"><label>FIELD TIMELINE</label>'+tl(active.events)+'</div><div class="panel"><label>EVIDENCE REGISTER</label>'+(active.evidence.length?active.evidence.map(x=>'<div class="archive"><b>'+esc(x.id)+'</b> '+esc(x.time)+'<div>'+esc(x.note)+'</div></div>').join(''):'NO EVIDENCE')+'</div>'+
'<div class="panel"><button onclick="complete()">COMPLETE & ARCHIVE CASE</button></div>'}
function renderArchive(){let q=($('search').value||'').toLowerCase(),a=archives(),r=a.filter(c=>!q||[c.caseId,c.location,c.archivedAt,c.unit].some(v=>String(v||'').toLowerCase().includes(q)));$('count').textContent=a.length+' ARCHIVED CASES / '+r.length+' MATCHING';$('archiveList').innerHTML=r.length?r.map(c=>'<div class="archive"><b>'+esc(c.caseId)+'</b> <span class="small">'+esc(c.archivedAt)+'</span><div>'+esc(c.location||'NO LOCATION')+'</div><div class="small">'+(c.events?.length||0)+' TIMELINE RECORDS · '+(c.evidence?.length||0)+' EVIDENCE ITEMS</div><button onclick="openArchive(\''+encodeURIComponent(c.caseId)+'\')">OPEN READ-ONLY</button></div>').join(''):'<div class="panel">NO ARCHIVED CASES MATCH THE SEARCH</div>'}
function openArchive(id){archived=archives().find(c=>c.caseId===decodeURIComponent(id));if(!archived)return;show('archiveView');$('archiveDetail').innerHTML='<div class="notice">READ-ONLY ARCHIVE RECORD — ACTIVE CASE STORAGE IS UNTOUCHED.</div><div class="panel"><div class="grid"><div><label>CASE ID</label>'+esc(archived.caseId)+'</div><div><label>FINAL STATUS</label>'+esc(archived.status)+'</div><div><label>LOCATION</label>'+esc(archived.location)+'</div><div><label>UNIT / VEHICLE</label>'+esc(archived.unit)+' / '+esc(archived.vehicle)+'</div><div><label>CREATED</label>'+esc(archived.createdAt)+'</div><div><label>ARCHIVED</label>'+esc(archived.archivedAt)+'</div></div></div><div class="panel"><label>FIELD TIMELINE</label>'+tl(archived.events)+'</div><div class="panel"><label>EVIDENCE REGISTER</label>'+(archived.evidence?.length?archived.evidence.map(x=>'<div class="archive"><b>'+esc(x.id)+'</b> '+esc(x.time)+'<div>'+esc(x.note)+'</div></div>').join(''):'NO EVIDENCE')+'</div><div class="row"><button onclick="show(\'archive\')">BACK TO ARCHIVE</button><button onclick="show(\'home\')">HOME</button></div>'}
load();
</script></body></html>
